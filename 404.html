<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — 404 — Stackly Tourism & Travel Portal</title>
  <meta name="description" content="Oops! Looks like you've taken a wrong turn on your journey. Return to Stackly Home and discover breathtaking destinations worldwide.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--bg-subtle-blue);">

  <!-- STACKLY PRELOADER: BUILDING REVEAL + TRAVEL ANIMATION + LOGO REVEAL -->
  <div id="stacklyPreloader" class="stackly-preloader" aria-label="Loading Stackly Travel Portal">
    <div class="preloader-stage">
      <svg class="flight-path-svg" viewBox="0 0 300 120">
        <path class="flight-arc" d="M 20,100 Q 150,-10 280,100" />
        <path id="preloaderPlane" class="plane-marker" d="M 0,-6 L 8,0 L 0,6 L 2,1 L -6,4 L -4,0 L -6,-4 L 2,-1 Z">
          <animateMotion path="M 20,100 Q 150,-10 280,100" dur="2.2s" repeatCount="indefinite" rotate="auto" />
        </path>
      </svg>
      <svg class="building-reveal-svg" viewBox="0 0 220 130">
        <line x1="10" y1="125" x2="210" y2="125" class="arch-line" stroke-width="3" />
        <rect x="25" y="60" width="28" height="65" class="arch-fill" />
        <rect x="25" y="60" width="28" height="65" class="arch-line" />
        <rect x="63" y="40" width="34" height="85" class="arch-fill" />
        <rect x="63" y="40" width="34" height="85" class="arch-line" />
        <rect x="107" y="20" width="45" height="105" class="arch-fill" />
        <rect x="107" y="20" width="45" height="105" class="arch-line" />
        <rect x="162" y="50" width="32" height="75" class="arch-fill" />
        <rect x="162" y="50" width="32" height="75" class="arch-line" />
        <path d="M 107,20 L 129.5,2 L 152,20 Z" class="arch-line" />
        <path d="M 32,80 Q 39,70 46,80 L 46,125 L 32,125 Z" class="arch-line" />
        <path d="M 72,60 Q 80,50 88,60 L 88,125 L 72,125 Z" class="arch-line" />
        <path d="M 120,45 Q 129.5,35 139,45 L 139,125 L 120,125 Z" class="arch-line" />
        <path d="M 170,70 Q 178,60 186,70 L 186,125 L 170,125 Z" class="arch-line" />
      </svg>
      <div id="preloaderLogoWrap" class="preloader-logo-wrap">
        <img src="assets/images/ui/logo.webp" alt="Stackly Tourism & Travel" class="preloader-logo">
      </div>
      <div id="preloaderBrandText" class="preloader-text">EXPLORE • DISCOVER • JOURNEY</div>
      <div class="preloader-bar-wrap">
        <div id="preloaderProgressBar" class="preloader-bar"></div>
      </div>
    </div>
  </div>

  <main class="page-404-wrapper">
    <div class="auth-bg-blob"></div>

    <div class="error-404-container">
      <a href="index.html" aria-label="Stackly Home">
        <img src="assets/images/ui/logo.webp" alt="Stackly Tourism & Travel" class="error-404-logo">
      </a>

      <!-- 404 DISPLAY: ZERO AS ROTATING GLOBE WITH ORBITING AIRPLANE -->
      <div class="display-404-row">
        <span>4</span>
        <div class="globe-404-wrap">
          <div class="spinning-globe">
            <div class="globe-grid-lines"></div>
          </div>
          <!-- Orbiting airplane flight path -->
          <div class="orbit-plane-404">
            <i class="fas fa-plane orbit-plane-icon"></i>
          </div>
        </div>
        <span>4</span>
      </div>

      <h1 class="error-404-title">Oops! Looks like you've taken a wrong turn on your journey.</h1>
      <p class="error-404-desc">
        Don't worry. Even the greatest explorers lose their coordinates from time to time. Your next adventure is just one click away.
      </p>

      <div class="error-404-actions">
        <button type="button" class="btn btn-primary btn-lg" id="goBackBtn">
          <i class="fas fa-arrow-left"></i> Go Back
        </button>
        <a href="index.html" class="btn btn-outline btn-lg" id="backToHomeBtn">
          <i class="fas fa-home"></i> Back to Home
        </a>
      </div>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    let isGoingBack = false;
    function handleGoBack() {
      if (isGoingBack) return;
      isGoingBack = true;

      if (typeof window.handleGoBack === 'function' && window.handleGoBack !== handleGoBack) {
        window.handleGoBack();
        return;
      }

      let returnState = null;
      try {
        const raw = sessionStorage.getItem('stackly_nav_return_state');
        if (raw) returnState = JSON.parse(raw);
        sessionStorage.setItem('stackly_should_restore_scroll', 'true');
      } catch (e) {}

      let targetUrl = '';
      if (returnState && returnState.url && !returnState.url.includes('404.html')) {
        targetUrl = returnState.url;
      } else if (document.referrer && !document.referrer.includes('404.html') && document.referrer.length > 5) {
        targetUrl = document.referrer;
      }

      if (targetUrl) {
        window.location.replace(targetUrl);
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.replace('index.html');
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      var goBackBtn = document.getElementById('goBackBtn');
      if (goBackBtn) {
        goBackBtn.addEventListener('click', handleGoBack);
      }
    });
  </script>
</body>
</html>
